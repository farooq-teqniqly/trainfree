name: Deploy to Cloudflare Workers

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-workers
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        # wrangler.jsonc names a single fixed Worker, so a deploy from a feature branch
        # would overwrite production. Only main's content may deploy -- but this workflow's
        # main trigger is a tag push, where github.ref is refs/tags/v0.0.N, never
        # refs/heads/main. Matching on the branch alone silently skipped every tagged
        # deploy. Tags are admitted here and then checked against main below, since a tag
        # can be pushed from any branch.
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history so the ancestry check below can see main.
                  fetch-depth: 0

            - name: Verify tag is on main
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main. Only tags on main may deploy."
                    exit 1
                  fi

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Publish
              run: dotnet publish src/Trainfree.Web/Trainfree.Web.csproj -c Release

            # A stale _redirects left in publish/wwwroot from an earlier build would fail the
            # asset validator ("Infinite loop detected") against not_found_handling.
            - name: Remove stray _redirects
              run: rm -f src/Trainfree.Web/bin/Release/net10.0/publish/wwwroot/_redirects

            - name: Apply D1 migrations
              # Runs before deploy so a slice that adds a migration (e.g.
              # 0002_add_programs_name_unique_index.sql) reaches the remote database on
              # every tag, per CLAUDE.md ("wrangler d1 migrations apply runs automatically
              # in deploy.yaml on every tag").
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: src/Trainfree.Api
                  wranglerVersion: "4.118.0"
                  command: d1 migrations apply trainfree_db --remote

            - name: Deploy
              # Pinned to a SHA rather than a floating tag: this is the step that handles the
              # Cloudflare API token. SHA is the v4 tag as of 2026-08-02.
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  # wrangler.deploy.jsonc's `main` handles /api/* and `assets` serves the
                  # Blazor output published above -- deploying from src/Trainfree.Web
                  # (assets-only, no `main`) previously shipped a Worker with no API and
                  # no D1 binding under the same Worker name.
                  workingDirectory: src/Trainfree.Api
                  wranglerVersion: "4.118.0"
                  command: deploy --config wrangler.deploy.jsonc
