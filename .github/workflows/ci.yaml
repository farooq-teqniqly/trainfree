name: Build, Test & Run SonarQube Analysis

on:
  push:
    branches: [main]
    # The changes job below cannot filter push events (see its comment), so the
    # docs-only skip for main is expressed at the trigger instead. GitHub skips
    # the run only when EVERY changed path matches, which is the same semantics
    # the filter gives PRs. Keep this list in sync with the filter's exclusions.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openspec/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}

    steps:
      # Docs- and spec-only PRs skip the build entirely. The filter still runs
      # (and still reports a status), so a required check never hangs.
      #
      # Markdown is excluded wherever it lives, not just under docs/: README.md,
      # CLAUDE.md, DEVELOPER.md and per-directory notes cannot change build or
      # test output. Config that does affect the build (.editorconfig, props,
      # global.json, the hooks) is deliberately NOT excluded.
      #
      # PR-only: on pull_request the action diffs via the GitHub API and needs no
      # working tree. On push/workflow_dispatch it would shell out to git (no
      # checkout here) and, on main, diff the default branch against itself and
      # report no changes -- so those events skip the filter and always build.
      - name: Detect non-docs changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          # Required. The action defaults to 'some' (a file matches the rule if
          # it matches ANY pattern), under which the leading "**" below matches
          # everything and every "!" line becomes dead code -- the filter then
          # reports code=true for docs-only PRs. 'every' requires a file to
          # match all patterns, which is what makes the exclusions bite.
          # Note: this pin only accepts 'every' or 'some'; the newer
          # 'some-with-excludes' does not exist in v3 and would throw.
          predicate-quantifier: "every"
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!openspec/**"
              - "!LICENSE"
              - "!.gitignore"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore "Trainfree.slnx"

      - name: Build solution
        run: dotnet build "Trainfree.slnx" --configuration Release --no-restore

      # Tests run here only for PRs from forks. A fork PR cannot read SONAR_TOKEN,
      # so the sonarqube-analysis job (which runs the same tests with coverage) is
      # skipped for it -- this step is the fallback so fork PRs are still tested.
      # Same-repo PRs and pushes get their test run from sonarqube-analysis instead
      # of running the suite twice.
      - name: Run tests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: dotnet test "Trainfree.slnx" --configuration Release --no-build --verbosity normal

  worker-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Trainfree.Api/package-lock.json

      - name: Install dependencies
        working-directory: src/Trainfree.Api
        run: npm ci

      - name: Run vitest
        working-directory: src/Trainfree.Api
        run: npm test

  workflow-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      # Pinned by version and checksum. actionlint has no first-party action, and its
      # documented install path pipes a remote script into bash -- an unpinned third party
      # in the build, which is the same thing deploy.yaml's SHA-pinned wrangler-action
      # avoids. Bump both values together; the hash is from the release's checksums.txt.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # --proto governs the initial request only; --proto-redir is what keeps a
          # redirect from downgrading the download to plain HTTP. Both are needed with
          # --location (SonarCloud githubactions:S6506). The checksum below still owns
          # integrity -- this closes the tamperable hop ahead of it.
          curl --silent --show-error --location --fail --max-time 120 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/

      # actionlint runs shellcheck over every `run:` block, but only if shellcheck is on
      # PATH -- otherwise it silently skips that half of the check. The runner image ships
      # it; assert that here so the day it stops shipping is a failure, not a quiet
      # downgrade.
      - name: Verify shellcheck is present
        run: shellcheck --version

      - name: Lint workflows
        run: actionlint -color

      # The workflows' own scripts live outside any `run:` block, so actionlint does not
      # reach them.
      - name: Lint shell scripts
        run: shellcheck .github/scripts/*.sh .githooks/*

  sonarqube-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # SonarCloud keys the project as <organization>_<repo-name>. Adjust if the
      # repo name differs from the project name, or drop this job if the project
      # is not on SonarCloud.
      SONAR_PROJECT_KEY: farooq-teqniqly_trainfree
      SONAR_ORGANIZATION: farooq-teqniqly
      # Coverage-only exclusions: these files are still analyzed for issues, they just
      # do not count toward the coverage metric. All .js is excluded (not only
      # wwwroot/js/) because the JavaScript here is:
      #  - Blazor's service-worker glue which runs in the browser's service-worker scope and no .NET test can execute.
      #  - Bootstrap JavaScript
      SONAR_EXCLUSIONS: "**/*.Tests/**,**/*.ArchitectureTests/**,**/samples/**,**/*.py,**/Scripts/*.sql,**/*.js"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate SONAR_TOKEN
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN secret is not set; configure it in repository secrets." >&2
            exit 1
          fi

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarQube Scanner
        run: dotnet tool install --global dotnet-sonarscanner --version 11.2.1

      - name: Restore dependencies
        run: dotnet restore "Trainfree.slnx"

      - name: Begin SonarQube analysis
        run: |
          dotnet sonarscanner begin \
            /k:"${{env.SONAR_PROJECT_KEY}}" \
            /o:"${{env.SONAR_ORGANIZATION}}" \
            /d:sonar.token="${{env.SONAR_TOKEN}}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" \
            /d:sonar.security.enableProjectScan=true \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.coverage.exclusions="${{env.SONAR_EXCLUSIONS}}"

      - name: Build solution
        run: dotnet build "Trainfree.slnx" --configuration Release --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test "Trainfree.slnx" --configuration Release --no-build \
            --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{env.SONAR_TOKEN}}"
